<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>پنل مدیریت لاوین</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>
<div class="login" id="login"><form class="card" id="lf" style="padding:32px">
  <div class="brand" style="color:var(--ink);padding-bottom:18px"><i id="lg"></i><span>لاوین<br><small style="font-weight:500;color:var(--mut);font-size:.75rem">ورود به پنل مدیریت</small></span></div>
  <div class="f"><label>نام کاربری<input id="lu" autocomplete="username" required></label><label>رمز عبور<input id="lp" type="password" autocomplete="current-password" required></label></div>
  <p id="le" role="alert" style="color:var(--bad);min-height:26px;margin:8px 0"></p>
  <button class="btn" style="width:100%;justify-content:center">ورود به پنل</button>
</form></div>
<div class="app" id="app" hidden>
  <aside class="side" id="side"></aside>
  <div><header class="top"><button class="ico burger" id="burger" aria-label="منو"></button><h1 id="ttl"></h1><span class="sp"></span><span class="pill" id="today"></span></header>
  <main id="view"></main></div>
</div>
<div id="modal"></div><div class="toasts" id="toasts" aria-live="polite"></div>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/theme.js" data-manual></script>
